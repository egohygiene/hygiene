{
  "schema_version": "1.0.0",
  "architecture_release": "architecture-v0.1.0",
  "organization": "egohygiene",
  "canonical_repository": "egohygiene/hygiene",
  "governed_by": [
    "ADR-0001"
  ],
  "default_policy": {
    "integration": "versioned-public-contract",
    "pinning": "immutable-or-versioned",
    "copied_sibling_source": "forbidden",
    "mutable_default_branch": "forbidden",
    "unknown_dependency": "deny"
  },
  "rules": [
    {
      "id": "BOUNDARY-001",
      "title": "Producer-owned source",
      "severity": "error",
      "statement": "A consumer must not copy, vendor, or directly import source owned by a sibling repository."
    },
    {
      "id": "BOUNDARY-002",
      "title": "Immutable cross-repository references",
      "severity": "error",
      "statement": "A cross-repository dependency must use an immutable commit or a versioned release and must not track a mutable default branch."
    },
    {
      "id": "BOUNDARY-003",
      "title": "Stable public interfaces",
      "severity": "error",
      "statement": "Sibling capabilities integrate only through producer-owned schemas, packages, binaries, images, reusable workflows, APIs, or generated projections."
    },
    {
      "id": "BOUNDARY-004",
      "title": "Independent media engines",
      "severity": "error",
      "statement": "Aniflow, Optiflow, and Renderflow remain standalone and integrate through Flow rather than depending directly on one another."
    },
    {
      "id": "BOUNDARY-005",
      "title": "Bounded runtime images",
      "severity": "error",
      "statement": "Realm images use explicit capability profiles and must not become an unbounded universal image containing every optional tool or service."
    },
    {
      "id": "BOUNDARY-006",
      "title": "No secret material",
      "severity": "error",
      "statement": "Repositories, images, templates, fixtures, diagrams, and generated context must not contain credentials, signing material, or private identity data."
    },
    {
      "id": "BOUNDARY-007",
      "title": "Reviewable control-plane authority",
      "severity": "error",
      "statement": "Holon creates, Pace proposes convergence, and Observatory observes; none silently mutates an existing default branch."
    }
  ],
